# Release QFunnyWidgets to PyPI and GitHub Releases.
#
#   git tag v1.0.0 && git push origin v1.0.0      -> test, build, publish to PyPI, create the GitHub release
#   Actions tab > Release > Run workflow          -> test, build, publish to TestPyPI (a dry run)
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub. One-time setup is
# described in README.md ("Releasing").
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish a manual run"
        type: choice
        options:
          - testpypi
          - none
        default: testpypi

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.qt }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
        qt: [pyqt5, pyqt6]
        # PySide6 is left out until ManyQt fixes its import crash with PySide6 >= 6.8 on Python >= 3.11
        # (see README "Known issue"); to test it, add "pyside6" to the list above.
    env:
      QT_API: ${{ matrix.qt }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install system libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install ManyQt and ${{ matrix.qt }}
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.qt }}" in
            pyqt5)   pip install ManyQt PyQt5 ;;
            pyqt6)   pip install ManyQt PyQt6 ;;
            pyside6) pip install ManyQt PySide6 ;;
          esac

      - name: Smoke tests (all demos + Designer plugins)
        run: python tests/smoke.py

  python2:
    name: Python 2.7 syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Compile every file with CPython 2.7
        # GitHub no longer provides Python 2.7, so use the official Docker image.
        run: docker run --rm -v "$PWD:/src" -w /src python:2.7-slim python -m compileall -q -x '(^|/)(build|dist)/' .

  build:
    name: Build distributions
    needs: [test, python2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python -c "import re; print(re.search(r\"^__version__ = '([^']+)'\", open('QFunnyWidgets/__init__.py').read(), re.M).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match QFunnyWidgets.__version__ ($VERSION)"
            exit 1
          fi
          echo "Releasing version $VERSION"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check distribution contents
        run: |
          python - <<'PY'
          import glob, tarfile, zipfile
          wheels = glob.glob('dist/*-py2.py3-none-any.whl')
          sdists = glob.glob('dist/*.tar.gz')
          assert len(wheels) == 1, 'expected one universal (py2.py3) wheel, got %s' % glob.glob('dist/*')
          assert len(sdists) == 1, 'expected one sdist'
          names = zipfile.ZipFile(wheels[0]).namelist()
          logos = [n for n in names if n.endswith('/logo.png')]
          plugins = [n for n in names if n.startswith('QFunnyWidgets/plugins/') and n.endswith('.py')]
          assert len(logos) == 35, 'wheel has %d logos, expected 35' % len(logos)
          assert len(plugins) == 4, 'wheel has %d plugin files, expected 4' % len(plugins)
          assert not [n for n in names if n.endswith('.pyc') or '__pycache__' in n], 'compiled files in wheel'
          members = tarfile.open(sdists[0]).getnames()
          for required in ('setup.py', 'README.md', 'plugins/funnywidgetsplugin.py'):
              assert any(m.endswith(required) for m in members), 'sdist is missing %s' % required
          print('OK: %s (%d logos, %d plugin files) and %s' % (wheels[0], len(logos), len(plugins), sdists[0]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/QFunnyWidgets/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/QFunnyWidgets/
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # re-running a dry run with the same version is fine

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release with the distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]*$ ]]; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "QFunnyWidgets ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            $PRERELEASE
